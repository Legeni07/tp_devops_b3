# Jenkins pour les TPs : docker compose up -d --build
# Prérequis : fichier .env contenant DOCKER_GID (voir TP 3.1)
services:
  jenkins:
    build: .
    image: legeni/jenkins:lts
    container_name: jenkins
    restart: unless-stopped
    ports:
      - "8080:8080"     # interface web
      - "50000:50000"   # connexion des agents
    group_add:
      - "${DOCKER_GID:?Définir DOCKER_GID dans .env}"   # accès au socket Docker sans chmod 666
    volumes:
      - jenkins_home:/var/jenkins_home                  # TOUTE la configuration Jenkins est ici
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  jenkins_home:
