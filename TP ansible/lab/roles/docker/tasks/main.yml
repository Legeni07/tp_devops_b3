---
- name: Installer les prérequis
  ansible.builtin.apt:
    name: [ca-certificates, curl, python3-requests, python3-docker]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Créer le dossier des clés APT
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Télécharger la clé GPG de Docker
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Ajouter le dépôt Docker
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ 'amd64' if ansible_facts['architecture'] == 'x86_64' else 'arm64' }}
      signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}
      {{ ansible_facts['distribution_release'] }} stable
    filename: docker
    state: present

- name: Installer Docker
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
  notify: Redémarrer docker

- name: Démarrer Docker
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Autoriser les utilisateurs à utiliser Docker
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users }}"
